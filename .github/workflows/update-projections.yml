name: Update Clay projections

on:
  schedule:
    # Daily at 11:00 UTC (7 AM ET during DST, 6 AM ET in winter).
    # Clay typically updates the PDF overnight; this catches it before
    # most US drafters start their day.
    - cron: "0 11 * * *"
  workflow_dispatch: {}  # allow manual triggering from the Actions tab

permissions:
  contents: write  # peaceiris pushes to gh-pages with GITHUB_TOKEN

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run build.py
        run: python build.py

      - name: Stage feed outputs for publish
        # build.py writes projections/nfl_2026.json + sources/clay_*.json
        # into the repo working tree. Copy just those into ./build/ so
        # publish_dir excludes build.py, requirements.txt, teams/, etc.
        run: |
          mkdir -p build/projections build/sources
          cp projections/nfl_2026.json build/projections/
          cp sources/clay_*.json build/sources/

      - name: Publish to gh-pages
        # gh-pages is shared with the sim repo's feed (_meta.json + v1/).
        # keep_files: true means peaceiris only adds/updates files under
        # publish_dir and never deletes pre-existing paths, so the sim
        # feed survives untouched. Downside: if build.py ever stops
        # emitting one of Clay's files, the stale copy lingers on
        # gh-pages forever — acceptable since build.py fails loudly on
        # parse errors rather than producing partial output.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
          keep_files: true
          commit_message: "data: refresh Clay projections"
